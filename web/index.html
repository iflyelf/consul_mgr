<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#f5efe6">
  <title>Consul Manager</title>
  <script>
    // 首屏应用主题，避免主题闪烁（FOUC）
    (function () {
      try {
        var legacy = { light: 'warm', blue: 'cool' };
        var t = localStorage.getItem('consul_mgr_theme') || localStorage.getItem('theme');
        if (t && legacy[t]) t = legacy[t];
        if (t !== 'warm' && t !== 'cool' && t !== 'dark') {
          t = (window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches) ? 'dark' : 'warm';
        }
        document.documentElement.setAttribute('data-theme', t);
      } catch (e) {
        document.documentElement.setAttribute('data-theme', 'warm');
      }
    })();
  </script>
</head>
<body>
  <div id="app"></div>
  <script type="module" src="/src/main.js"></script>
</body>
</html>
