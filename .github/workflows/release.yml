name: Build and Release

on:
  push:
    branches:
      - main

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    strategy:
      matrix:
        goos: [linux, darwin, windows]
        goarch: [amd64, arm64]
        exclude:
          - goos: windows
            goarch: arm64

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.26'

      - name: Build
        env:
          CGO_ENABLED: 0
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
        run: |
          OUTPUT_NAME="consul_mgr-${{ matrix.goos }}-${{ matrix.goarch }}"
          if [ "${{ matrix.goos }}" = "windows" ]; then
            OUTPUT_NAME="${OUTPUT_NAME}.exe"
          fi
          go build -trimpath -ldflags "-s -w" -o ${OUTPUT_NAME} ./cmd/api
          
      - name: Archive
        run: |
          if [ "${{ matrix.goos }}" = "windows" ]; then
            zip consul_mgr-${{ matrix.goos }}-${{ matrix.goarch }}.zip consul_mgr-${{ matrix.goos }}-${{ matrix.goarch }}.exe
          else
            tar czf consul_mgr-${{ matrix.goos }}-${{ matrix.goarch }}.tar.gz consul_mgr-${{ matrix.goos }}-${{ matrix.goarch }}
          fi

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: consul_mgr-${{ matrix.goos }}-${{ matrix.goarch }}
          path: consul_mgr-${{ matrix.goos }}-${{ matrix.goarch }}.*

  release:
    name: Update Latest Release
    needs: build
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Prepare release files
        run: |
          mkdir -p release
          cd artifacts
          for dir in */; do
            cp -r "$dir"* ../release/
          done
          cd ../release
          ls -lh

      - name: Delete old latest release
        continue-on-error: true
        run: |
          gh release delete latest --yes
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Create Latest Release
        uses: softprops/action-gh-release@v1
        with:
          tag_name: latest
          name: Latest Release
          files: release/*
          draft: false
          prerelease: false
          body: |
            ## Consul Manager - Latest Version
            
            自动构建于: ${{ github.sha }}
            
            ### 下载
            
            - **Linux (amd64)**: `consul_mgr-linux-amd64.tar.gz`
            - **Linux (arm64)**: `consul_mgr-linux-arm64.tar.gz`
            - **macOS (amd64)**: `consul_mgr-darwin-amd64.tar.gz`
            - **macOS (arm64)**: `consul_mgr-darwin-arm64.tar.gz`
            - **Windows (amd64)**: `consul_mgr-windows-amd64.zip`
            
            ### 安装
            
            ```bash
            # Linux/macOS
            tar xzf consul_mgr-*.tar.gz
            chmod +x consul_mgr-*
            
            # 设置环境变量
            export DATABASE_URL="postgresql://user:pass@host:5432/consul_mgr"
            export ADMIN_PASSWORD="your_password"
            
            # 运行
            ./consul_mgr-* -c etc/config.yaml
            ```
            
            ### 主要功能
            
            - ✅ 零硬编码 - 所有配置通过环境变量
            - ✅ Consul Services 管理 - 增删改查、批量操作
            - ✅ Consul Instances 管理 - 完整生命周期管理
            - ✅ 批量操作 - 批量删除、导入、导出
            - ✅ 多格式支持 - JSON/YAML/CSV
            
            ### 环境变量
            
            必填:
            - `DATABASE_URL` - PostgreSQL 连接字符串
            - `ADMIN_PASSWORD` - 管理员密码
            
            可选:
            - `SERVER_PORT` - 服务端口 (默认: 8080)
            - `WEB_PORT` - 前端端口 (默认: 5173)
            - `JWT_SECRET` - JWT 密钥
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
