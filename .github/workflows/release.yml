name: Build and Release

on:
  push:
    branches:
      - main

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    strategy:
      matrix:
        goos: [linux, darwin, windows]
        goarch: [amd64, arm64]
        exclude:
          - goos: windows
            goarch: arm64

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.21'

      - name: Build
        env:
          CGO_ENABLED: 0
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
        run: |
          OUTPUT_NAME="consul_mgr-${{ matrix.goos }}-${{ matrix.goarch }}"
          if [ "${{ matrix.goos }}" = "windows" ]; then
            OUTPUT_NAME="${OUTPUT_NAME}.exe"
          fi
          go build -trimpath -ldflags "-s -w" -o ${OUTPUT_NAME} ./cmd/api
          
      - name: Archive
        run: |
          if [ "${{ matrix.goos }}" = "windows" ]; then
            zip consul_mgr-${{ matrix.goos }}-${{ matrix.goarch }}.zip consul_mgr-${{ matrix.goos }}-${{ matrix.goarch }}.exe
          else
            tar czf consul_mgr-${{ matrix.goos }}-${{ matrix.goarch }}.tar.gz consul_mgr-${{ matrix.goos }}-${{ matrix.goarch }}
          fi

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: consul_mgr-${{ matrix.goos }}-${{ matrix.goarch }}
          path: consul_mgr-${{ matrix.goos }}-${{ matrix.goarch }}.*

  docker:
    name: Build and Push Docker Image
    runs-on: ubuntu-latest
    needs: build
    
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build and push
        uses: docker/build-push-action@v5
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            iflyelf/consul-mgr:latest
            iflyelf/consul-mgr:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  release:
    name: Update Latest Release
    needs: [build, docker]
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Prepare release files
        run: |
          mkdir -p release
          cd artifacts
          for dir in */; do
            cp -r "$dir"* ../release/
          done
          cd ../release
          ls -lh

      - name: Delete old latest release
        continue-on-error: true
        run: |
          gh release delete latest --yes
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Create Latest Release
        uses: softprops/action-gh-release@v1
        with:
          tag_name: latest
          name: Latest Release
          files: release/*
          draft: false
          prerelease: false
          body: |
            ## Consul Manager - Latest Version
            
            **Commit**: ${{ github.sha }}
            **Date**: ${{ github.event.head_commit.timestamp }}
            
            ### 📥 下载
            
            - **Linux (amd64)**: `consul_mgr-linux-amd64.tar.gz`
            - **Linux (arm64)**: `consul_mgr-linux-arm64.tar.gz`
            - **macOS (amd64)**: `consul_mgr-darwin-amd64.tar.gz`
            - **macOS (arm64)**: `consul_mgr-darwin-arm64.tar.gz`
            - **Windows (amd64)**: `consul_mgr-windows-amd64.zip`
            
            ### 🐳 Docker 镜像
            
            ```bash
            docker pull iflyelf/consul-mgr:latest
            ```
            
            ### 🚀 快速开始
            
            ```bash
            # 下载并解压
            tar xzf consul_mgr-linux-amd64.tar.gz
            chmod +x consul_mgr-linux-amd64
            
            # 设置环境变量
            export DATABASE_URL="postgresql://user:pass@host:5432/consul_mgr"
            export ADMIN_PASSWORD="your_password"
            
            # 运行
            ./consul_mgr-linux-amd64 -c etc/config.yaml
            ```
            
            ### ✨ 主要功能
            
            - ✅ 零硬编码 - 所有配置通过环境变量
            - ✅ Consul Services 管理 - 增删改查、批量操作
            - ✅ Consul Instances 管理 - 完整生命周期管理
            - ✅ 批量操作 - 批量删除、导入、导出 (JSON/YAML/CSV)
            - ✅ 健康检查 - HTTP/TCP/TTL/GRPC
            
            ### 📝 环境变量
            
            必填:
            - `DATABASE_URL` - PostgreSQL 连接字符串
            - `ADMIN_PASSWORD` - 管理员密码
            
            可选:
            - `SERVER_PORT` - 服务端口 (默认: 8080)
            - `WEB_PORT` - 前端端口 (默认: 5173)
            - `JWT_SECRET` - JWT 密钥
            
            ### 📚 文档
            
            查看完整文档: [README.md](https://github.com/iflyelf/consul_mgr#readme)
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
