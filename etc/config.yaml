# =============================================================================
# Consul Manager 配置文件（开发环境）
#
# 所有参数均可通过环境变量覆盖，语法：${VAR:default}
# 代码中不硬编码任何地址、端口与凭据。
#
# 认证说明：
#   本项目使用外部 FlyIAM 提供的 Casdoor 服务进行统一认证
#   请确保 FlyIAM 服务已启动并配置正确的组织和应用
# =============================================================================

Name: consul_mgr
Host: 0.0.0.0
Port: 8080
Mode: dev
# 服务端超时(毫秒)，需大于 Consul 操作超时
Timeout: 30000

Database:
  # 优先使用完整 DSN；未设置时用下方分项拼装
  DSN: ""
  Host: localhost
  Port: 5432
  User: postgres
  Password: ""
  DBName: consul_mgr
  SSLMode: disable
  MaxOpenConns: 100
  MaxIdleConns: 10
  ConnMaxLifetime: 3600

JWT:
  Secret: ""
  AccessExpire: 7200
  RefreshExpire: 604800
  Issuer: consul_mgr

Admin:
  Username: admin
  Password: ""
  Email: 

Consul:
  DefaultAddress: ""
  DefaultToken: ""
  DefaultDatacenter: dc1
  Timeout: 10
  # 批量查询/操作并发上限（服务/实例数量多时避免串行变慢，同时防止打爆 Consul）
  MaxConcurrency: 16

Casdoor:
  # 后端访问 Casdoor 的地址（使用 FlyIAM 提供的服务）
  Endpoint: ""
  # 浏览器可达的 Casdoor 地址（跨域名/IP 部署必配，留空则用 Endpoint）
  PublicEndpoint: 
  ClientId: ""
  ClientSecret: ""
  Certificate: 
  # 使用 FlyIAM 的组织和应用（需与 FlyIAM 配置一致）
  OrganizationName: flyiam
  ApplicationName: flyiam

Web:
  Embedded: true
  StaticDir: ./web/dist
  Port: 5173
  Host: 0.0.0.0

LogConfig:
  Level: info
  Format: json

Redis:
  # 是否启用缓存（Redis 不可用时自动降级，不影响服务）
  Enabled: true
  Host: localhost
  Port: 6379
  Password: ""
  DB: 0
  # 缓存过期时间（秒）
  TTL: 300

Audit:
  Enabled: true
  RetentionDays: 90

Permission:
  EnableServiceGroupAuth: true
  DefaultPermissions: [read]
