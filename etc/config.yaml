Name: consul_mgr
Host: 0.0.0.0
Port: 8080
Mode: dev

Database:
  DSN: ${DATABASE_URL}

JWT:
  Secret: ${JWT_SECRET}
  AccessExpire: 7200
  RefreshExpire: 604800
  Issuer: consul_mgr

Admin:
  Username: ${ADMIN_USERNAME}
  Password: ${ADMIN_PASSWORD}
  Email: ${ADMIN_EMAIL}

Web:
  Embedded: true
  StaticDir: ./web/dist
  Port: 5173

LogConfig:
  Level: info
  Format: json

Audit:
  Enabled: true
  RetentionDays: 90
