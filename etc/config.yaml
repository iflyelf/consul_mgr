Name: consul_mgr
Host: 0.0.0.0
Port: 8080
Mode: dev
# 服务端超时(毫秒)，需大于 Consul 操作超时
Timeout: 30000

Database:
  DSN: ${DATABASE_URL}

JWT:
  Secret: ${JWT_SECRET}
  AccessExpire: 7200
  RefreshExpire: 604800
  Issuer: consul_mgr

Admin:
  Username: ${ADMIN_USERNAME}
  Password: ${ADMIN_PASSWORD}
  Email: ${ADMIN_EMAIL}

Consul:
  DefaultAddress: ${CONSUL_ADDRESS}
  DefaultToken: ${CONSUL_TOKEN}
  DefaultDatacenter: ${CONSUL_DATACENTER}
  Timeout: 10

Casdoor:
  Endpoint: ${CASDOOR_ENDPOINT}
  ClientId: ${CASDOOR_CLIENT_ID}
  ClientSecret: ${CASDOOR_CLIENT_SECRET}
  Certificate: ${CASDOOR_CERTIFICATE}
  OrganizationName: ${CASDOOR_ORGANIZATION}
  ApplicationName: ${CASDOOR_APPLICATION}

Web:
  Embedded: true
  StaticDir: ./web/dist
  Port: 5173

LogConfig:
  Level: info
  Format: json

Audit:
  Enabled: true
  RetentionDays: 90
