# =============================================================================
# Consul Manager - 应用部署（Deployment + Service + Ingress）
#
# 端口通过 SERVER_PORT（ConfigMap）自定义；容器与 Service 默认 8080。
# =============================================================================
apiVersion: apps/v1
kind: Deployment
metadata:
  name: consul-mgr
  namespace: consul-mgr
  labels:
    app: consul-mgr
spec:
  replicas: 2
  selector:
    matchLabels:
      app: consul-mgr
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  template:
    metadata:
      labels:
        app: consul-mgr
    spec:
      # 使用宿主机时区（可选）
      containers:
        - name: consul-mgr
          image: iflyelf/consul-mgr:latest
          imagePullPolicy: Always
          ports:
            - name: http
              containerPort: 8080
          envFrom:
            - configMapRef:
                name: consul-mgr-config
            - secretRef:
                name: consul-mgr-secret
          # 健康检查：使用二进制自带的 /health
          readinessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 30
            periodSeconds: 20
            timeoutSeconds: 5
            failureThreshold: 3
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: "1"
              memory: 512Mi
          securityContext:
            runAsNonRoot: false
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
              add: ["NET_BIND_SERVICE"]
---
apiVersion: v1
kind: Service
metadata:
  name: consul-mgr
  namespace: consul-mgr
  labels:
    app: consul-mgr
spec:
  type: ClusterIP
  selector:
    app: consul-mgr
  ports:
    - name: http
      port: 8080
      targetPort: http
---
# Ingress（按需启用，修改 host 为你的域名并确保已配置 Ingress Controller）
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: consul-mgr
  namespace: consul-mgr
  annotations:
    # 若使用 nginx-ingress，可按需调整
    nginx.ingress.kubernetes.io/proxy-body-size: "32m"
spec:
  ingressClassName: nginx
  rules:
    - host: consul-mgr.example.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: consul-mgr
                port:
                  number: 8080
