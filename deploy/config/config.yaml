# =============================================================================
# Consul Manager 配置文件（生产环境 / 容器部署）
#
# 所有参数均可通过环境变量覆盖，语法：${VAR:default}
# 代码中不硬编码任何地址、端口与凭据。
#
# 认证说明：
#   本项目使用外部 FlyIAM 提供的 Casdoor 服务进行统一认证
#   请确保 FlyIAM 服务已启动并配置正确的组织和应用
# =============================================================================

Name: consul_mgr
Host: 0.0.0.0
Port: 8080
Mode: release
Timeout: 30000

Database:
  # 优先使用完整 DSN；未设置时用下方分项拼装
  DSN: ""
  Host: localhost
  Port: 5432
  User: postgres
  Password: ""
  DBName: consul_mgr
  SSLMode: disable
  MaxOpenConns: 100
  MaxIdleConns: 10
  ConnMaxLifetime: 3600

JWT:
  Secret: ""
  AccessExpire: 7200
  RefreshExpire: 604800
  Issuer: consul_mgr

Admin:
  Username: admin
  Password: ""
  Email: 

Consul:
  DefaultAddress: http://localhost:8500
  DefaultToken: ""
  DefaultDatacenter: dc1
  Timeout: 10
  # 批量查询/操作并发上限（服务/实例数量多时避免串行变慢，同时防止打爆 Consul）
  MaxConcurrency: 16

Casdoor:
  Endpoint: http://localhost:8000
  PublicEndpoint: 
  ClientId: ""
  ClientSecret: ""
  Certificate: 
  # 使用 FlyIAM 的组织和应用（需与 FlyIAM 配置一致）
  OrganizationName: flyiam
  ApplicationName: flyiam
  # 新增用户时的默认密码（环境变量: CASDOOR_DEFAULT_PASSWORD）
  DefaultPassword: "ysyh!9Sky"

Web:
  Embedded: true
  StaticDir: ./web/dist
  Port: 5173
  Host: 0.0.0.0

LogConfig:
  Level: info
  Format: json

Redis:
  Enabled: true
  Host: localhost
  Port: 6379
  Password: ""
  DB: 0
  TTL: 300

Audit:
  Enabled: true
  RetentionDays: 90

Permission:
  EnableServiceGroupAuth: true
  DefaultPermissions: [read]
