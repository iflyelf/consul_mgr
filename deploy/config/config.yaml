Name: consul_mgr
Host: 0.0.0.0
Port: 8080
Mode: release

Database:
  DSN: ${DATABASE_URL}
  # 或者分开配置
  Host: ${DB_HOST:localhost}
  Port: ${DB_PORT:5432}
  User: ${DB_USER:postgres}
  Password: ${DB_PASSWORD}
  DBName: ${DB_NAME:consul_mgr}
  SSLMode: ${DB_SSLMODE:disable}
  MaxOpenConns: 100
  MaxIdleConns: 10
  ConnMaxLifetime: 3600

JWT:
  Secret: ${JWT_SECRET}
  AccessExpire: 7200
  RefreshExpire: 604800
  Issuer: consul_mgr

Admin:
  Username: ${ADMIN_USERNAME:admin}
  Password: ${ADMIN_PASSWORD}
  Email: ${ADMIN_EMAIL:admin@example.com}

Consul:
  DefaultAddress: ${CONSUL_ADDRESS:http://localhost:8500}
  DefaultToken: ${CONSUL_TOKEN:}
  DefaultDatacenter: ${CONSUL_DATACENTER:dc1}
  Timeout: 10

Casdoor:
  Endpoint: ${CASDOOR_ENDPOINT:http://localhost:8000}
  PublicEndpoint: ${CASDOOR_PUBLIC_ENDPOINT:}
  ClientId: ${CASDOOR_CLIENT_ID}
  ClientSecret: ${CASDOOR_CLIENT_SECRET}
  Certificate: ${CASDOOR_CERTIFICATE:}
  OrganizationName: ${CASDOOR_ORGANIZATION:consul_mgr}
  ApplicationName: ${CASDOOR_APPLICATION:consul_manager}

Web:
  Embedded: true
  StaticDir: ./web/dist

LogConfig:
  Level: info
  Format: json

Audit:
  Enabled: true
  RetentionDays: 90
