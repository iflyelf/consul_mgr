# =============================================================================
# Consul Manager 配置文件（生产环境 / 容器部署）
#
# 所有参数均可通过环境变量覆盖，语法：default
# 代码中不硬编码任何地址、端口与凭据。
# =============================================================================

Name: consul_mgr
Host: 0.0.0.0
Port: 8080
Mode: release
Timeout: 30000

Database:
  # 优先使用完整 DSN；未设置时用下方分项拼装
  DSN: ""
  Host: localhost
  Port: 5432
  User: postgres
  Password: ""
  DBName: consul_mgr
  SSLMode: disable
  MaxOpenConns: 100
  MaxIdleConns: 10
  ConnMaxLifetime: 3600

JWT:
  Secret: ""
  AccessExpire: 7200
  RefreshExpire: 604800
  Issuer: consul_mgr

Admin:
  Username: admin
  Password: ""
  Email: 

Consul:
  DefaultAddress: http://localhost:8500
  DefaultToken: 
  DefaultDatacenter: dc1
  Timeout: 10

Casdoor:
  Endpoint: http://localhost:8000
  PublicEndpoint: 
  ClientId: ""
  ClientSecret: ""
  Certificate: 
  OrganizationName: consul_mgr
  ApplicationName: consul_manager

Web:
  Embedded: true
  StaticDir: ./web/dist
  Port: 5173
  Host: 0.0.0.0

LogConfig:
  Level: info
  Format: json

Redis:
  Enabled: true
  Host: localhost
  Port: 6379
  Password: ""
  DB: 0
  TTL: 30

Audit:
  Enabled: true
  RetentionDays: 90

Permission:
  EnableServiceGroupAuth: true
  DefaultPermissions: [read]
