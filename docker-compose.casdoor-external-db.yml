version: '3.8'

services:
  # Casdoor 服务（使用外部数据库 - host 网络模式）
  casdoor:
    image: casbin/casdoor:latest
    container_name: casdoor
    network_mode: host
    environment:
      - RUNNING_IN_DOCKER=true
    volumes:
      - ./casdoor/conf:/conf
      - casdoor_data:/var/lib/casdoor
    restart: unless-stopped

  # Consul Manager 后端（使用 GitHub Actions 构建的镜像）
  consul_mgr_api:
    image: iflyelf/consul-mgr:latest
    container_name: consul_mgr_api
    network_mode: host
    environment:
      - DATABASE_URL=postgresql://iflyelf:1q23l@Yc45j@10.0.51.88:6000/consul_mgr?sslmode=disable
      - CASDOOR_ENDPOINT=http://localhost:8000
      - CASDOOR_CLIENT_ID=${CASDOOR_CLIENT_ID}
      - CASDOOR_CLIENT_SECRET=${CASDOOR_CLIENT_SECRET}
      - CASDOOR_ORGANIZATION=consul_mgr
      - CASDOOR_APPLICATION=consul_manager
      - JWT_SECRET=${JWT_SECRET:-consul_mgr_jwt_secret_key_min_32_chars}
    restart: unless-stopped

volumes:
  casdoor_data:
    driver: local
