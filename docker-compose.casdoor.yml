version: '3.8'

services:
  # Casdoor 服务
  casdoor:
    image: casbin/casdoor:latest
    container_name: casdoor
    ports:
      - "8000:8000"
    environment:
      - RUNNING_IN_DOCKER=true
    depends_on:
      - casdoor_db
    volumes:
      - ./casdoor/conf:/conf
    networks:
      - consul_mgr_network
    restart: unless-stopped

  # Casdoor 数据库
  casdoor_db:
    image: postgres:15-alpine
    container_name: casdoor_db
    environment:
      POSTGRES_DB: casdoor
      POSTGRES_USER: casdoor
      POSTGRES_PASSWORD: casdoor_password_change_me
    volumes:
      - casdoor_data:/var/lib/postgresql/data
    networks:
      - consul_mgr_network
    restart: unless-stopped

  # Consul Manager 数据库（已有）
  consul_mgr_db:
    image: postgres:15-alpine
    container_name: consul_mgr_db
    environment:
      POSTGRES_DB: consul_mgr
      POSTGRES_USER: consul_mgr
      POSTGRES_PASSWORD: consul_mgr_password_change_me
    volumes:
      - consul_mgr_data:/var/lib/postgresql/data
    networks:
      - consul_mgr_network
    restart: unless-stopped

  # Consul Manager 后端
  consul_mgr_api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: consul_mgr_api
    ports:
      - "8080:8080"
    environment:
      - DATABASE_URL=postgresql://consul_mgr:consul_mgr_password_change_me@consul_mgr_db:5432/consul_mgr?sslmode=disable
      - CASDOOR_ENDPOINT=http://casdoor:8000
      - CASDOOR_CLIENT_ID=your_client_id
      - CASDOOR_CLIENT_SECRET=your_client_secret
      - CASDOOR_ORGANIZATION=consul_mgr
      - CASDOOR_APPLICATION=consul_manager
      - JWT_SECRET=your_jwt_secret_min_32_chars
    depends_on:
      - consul_mgr_db
      - casdoor
    networks:
      - consul_mgr_network
    restart: unless-stopped

volumes:
  casdoor_data:
    driver: local
  consul_mgr_data:
    driver: local

networks:
  consul_mgr_network:
    driver: bridge
